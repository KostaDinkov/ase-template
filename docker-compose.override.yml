# Development overrides — auto-loaded by docker compose up
# Adds bind mounts, exposes ports directly, disables Traefik routing

services:
  api:
    build:
      target: development
    volumes:
      - ./services/api:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=true
    labels:
      - "traefik.enable=false"

  frontend:
    build:
      target: development
    volumes:
      - ./services/frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    labels:
      - "traefik.enable=false"
