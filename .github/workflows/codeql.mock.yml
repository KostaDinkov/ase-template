# MOCK workflow — runs on every push/PR to give fast green checks without
# running CodeQL analysis (which takes 5-10 min per language).
# The real workflow (codeql.yml) is set to workflow_dispatch + schedule only.

name: CodeQL

on:
  pull_request:
    branches: [main]
  pull_request_target:
    branches: [main]
  push:
    branches: [main]

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - run: echo "Mock — skipping CodeQL analysis for ${{ matrix.language }}"
