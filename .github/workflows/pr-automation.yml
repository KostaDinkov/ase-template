name: PR Automation

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  # ── Label agent-authored PRs ─────────────────────────────────────────────────
  label-agent-pr:
    name: Label agent PR
    runs-on: ubuntu-latest
    if: github.actor == 'github-actions[bot]' || github.actor == 'copilot-swe-agent[bot]'
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: ['agent-pr']
            });

  # ── Auto-merge when 'auto-merge' label is present ───────────────────────────
  # Enables GitHub's native auto-merge — the PR is squash-merged automatically
  # once all required status checks pass. Requires "Allow auto-merge" to be
  # enabled in the repository settings.
  auto-merge:
    name: Enable auto-merge
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'auto-merge')
    steps:
      - name: Enable auto-merge via GraphQL
        uses: actions/github-script@v9
        with:
          script: |
            await github.graphql(`
              mutation EnableAutoMerge($prId: ID!) {
                enablePullRequestAutoMerge(input: {
                  pullRequestId: $prId,
                  mergeMethod: SQUASH
                }) {
                  clientMutationId
                }
              }
            `, {
              prId: context.payload.pull_request.node_id
            });
