# MOCK workflow — runs on every push/PR to give fast green checks without
# building Docker images. The real workflow (ci.yml) is set to
# workflow_dispatch only so it can be triggered manually when needed.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      api: "true"
      frontend: "true"
    steps:
      - run: echo "Mock — skipping paths-filter, reporting all services changed"

  api:
    name: API
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - run: echo "Mock — skipping Docker build, lint, and test for api"

  frontend:
    name: Frontend
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - run: echo "Mock — skipping Docker build, lint, and test for frontend"

  # ── Required status gate ─────────────────────────────────────────────────────
  # Same job name as the real ci.yml so branch protection rules match.
  ci-gate:
    name: ci-gate
    runs-on: ubuntu-latest
    needs: [api, frontend]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "A mock CI job failed — this should not happen."
            exit 1
          fi
          echo "Mock CI gate passed."
