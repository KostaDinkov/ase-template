name: Service CI (reusable)

on:
  workflow_call:
    inputs:
      service_name:
        description: Short name of the service (e.g. api, frontend)
        type: string
        required: true
      service_path:
        description: Workspace-relative path to the service (e.g. services/api)
        type: string
        required: true

jobs:
  test-and-lint:
    name: Test & Lint — ${{ inputs.service_name }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.service_path }}
    steps:
      - uses: actions/checkout@v6

      - name: Lint
        run: make lint

      - name: Test
        run: make test

  build:
    name: Build image — ${{ inputs.service_name }}
    runs-on: ubuntu-latest
    needs: test-and-lint
    defaults:
      run:
        working-directory: ${{ inputs.service_path }}
    steps:
      - uses: actions/checkout@v6

      - name: Build production image
        run: make build
