name: Validate Compose

on:
  pull_request:
    paths:
      - 'docker-compose*.yml'
      - 'services/**/Dockerfile'
  push:
    branches: [main]
    paths:
      - 'docker-compose*.yml'
      - 'services/**/Dockerfile'

jobs:
  validate:
    name: Validate compose files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate base + dev override
        run: docker compose -f docker-compose.yml -f docker-compose.override.yml config --quiet

      - name: Validate base + prod
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
