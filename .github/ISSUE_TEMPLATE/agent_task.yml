name: Agent Task
description: A focused, well-scoped task to assign directly to GitHub Copilot cloud agent.
title: "chore: "
labels: ["agent-task"]
body:
  - type: markdown
    attributes:
      value: |
        Keep this task small and focused — one clear problem, one PR.
        Copilot works best with an explicit definition of done and file-level hints.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What needs to be done? Be specific and unambiguous.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Outcome
      description: What should exist or behave differently when this is done?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context & Hints
      description: Relevant files, functions, patterns, or services the agent should be aware of.
      placeholder: |
        - File: services/api/app/main.py
        - Pattern: follow existing route structure
        - Constraint: do not modify docker-compose.prod.yml

  - type: textarea
    id: dod
    attributes:
      label: Definition of Done
      description: Explicit checklist the agent must verify before opening the PR.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
