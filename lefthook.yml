commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

pre-commit:
  commands:
    gitleaks:
      run: >
        docker run --rm
        -v "{root}://repo"
        zricethezav/gitleaks:v8.27.2
        detect
        --source //repo
        --no-git
        --redact
        --log-level warn
